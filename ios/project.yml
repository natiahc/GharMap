name: PaisaPilot
options:
  bundleIdPrefix: com.paisapilot
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    HEADER_SEARCH_PATHS: '$(SRCROOT)/../finance/include'
targets:
  PaisaPilot:
    type: application
    platform: iOS
    sources:
      - path: PaisaPilot
      - path: ../finance/src/finance.cpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paisapilot.app
        SWIFT_OBJC_BRIDGING_HEADER: PaisaPilot/BridgingHeader.h
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PaisaPilot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: 3
  PaisaPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaisaPilotTests
      - path: ../fixtures
        buildPhase: resources
    dependencies:
      - target: PaisaPilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PaisaPilot:
    build:
      targets:
        PaisaPilot: all
        PaisaPilotTests: [test]
    test:
      targets: [PaisaPilotTests]
