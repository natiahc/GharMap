name: Android and native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finance checks with sanitizers
        run: bash scripts/test_finance.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build app/test APKs and run lint
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PaisaPilot-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/signing-certificate.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise finance records, review and persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.paisapilot.app/.MainActivity
            adb shell screencap -p /sdcard/paisapilot-home.png
            adb pull /sdcard/paisapilot-home.png app/build/paisapilot-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: Android-screen
          path: app/build/paisapilot-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-report
          path: app/build/reports/androidTests/connected/debug/
  publish:
    needs: [native, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PaisaPilot-debug
          path: package
      - name: Publish tested APK as a direct prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pilot_version=$(python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('app/build.gradle.kts').read_text()
          version=re.search(r'versionName = "([0-9][0-9A-Za-z._-]*)"',text).group(1)
          print(version)
          PY
          )
          pilot_tag="v$pilot_version"
          if gh release view "$pilot_tag" >/dev/null 2>&1; then
            echo "Version already published; preserving its existing APK and signing certificate."
            exit 0
          fi
          cp package/outputs/apk/debug/app-debug.apk "package/PaisaPilot-$pilot_version.apk"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          apk=next(Path('package').glob('PaisaPilot-*.apk'))
          notes=('Android pilot build. Paste financial alerts, CSV import, manual records, planning and encrypted backups are available. '
                 'This pilot does not request SMS inbox access. Keep Play Protect enabled; device acceptance is still subject to its checks. '
                 'Google Sheets connections require your OAuth/API setup.\n\nAPK SHA-256: '+hashlib.sha256(apk.read_bytes()).hexdigest()+'\n')
          Path('package/release-notes.txt').write_text(notes)
          PY
          gh release create "$pilot_tag" "package/PaisaPilot-$pilot_version.apk" package/signing-certificate.txt --target "$GITHUB_SHA" --prerelease --title "PaisaPilot $pilot_version" --notes-file package/release-notes.txt
