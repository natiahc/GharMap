name: iPhone finance checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate PaisaPilot Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Test finance bridge, backups and persistence on iPhone simulator
        working-directory: ios
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcodebuild -project PaisaPilot.xcodeproj -scheme PaisaPilot -destination "platform=iOS Simulator,id=$simulator_id" -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO test
          xcrun simctl install "$simulator_id" build/Build/Products/Debug-iphonesimulator/PaisaPilot.app
          xcrun simctl launch "$simulator_id" com.paisapilot.app
          sleep 1
          xcrun simctl io "$simulator_id" screenshot build/paisapilot-iphone.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-finance-test-results
          path: ios/build/Logs/Test/
      - uses: actions/upload-artifact@v4
        with:
          name: PaisaPilot-iPhone-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/PaisaPilot.app
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-finance-screen
          path: ios/build/paisapilot-iphone.png
